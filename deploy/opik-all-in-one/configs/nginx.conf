user nginx;
worker_processes auto;
error_log /dev/stderr info;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 2G;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream opik_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    upstream opik_healthd {
        server 127.0.0.1:5180;
        keepalive 2;
    }

    server {
        listen 0.0.0.0:5173 default_server;
        server_name _;
        root /var/lib/opik-frontend;
        index index.html;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location = /readyz {
            access_log off;
            proxy_pass http://opik_healthd/readyz;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location @api {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://opik_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/ {
            try_files /dev/null @api;
        }

        location = /oauth/consent {
            try_files /dev/null /index.html;
        }

        location ^~ /oauth/ {
            proxy_pass http://opik_backend;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 90s;
        }

        location = /.well-known/oauth-authorization-server {
            proxy_pass http://opik_backend;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Frame-Options "DENY" always;
    }
}

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:healthd]
command=/usr/local/bin/opik-healthd
autostart=true
autorestart=true
startsecs=1
priority=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bootstrap]
command=/usr/local/bin/opik-bootstrap
autostart=true
autorestart=false
startsecs=0
startretries=0
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mysql]
command=/bin/bash -lc 'exec /usr/sbin/mysqld --defaults-file=/etc/opik/mysql.cnf'
user=mysql
autostart=false
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=180
stopasgroup=true
killasgroup=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:redis]
command=/bin/bash -lc 'exec /usr/local/bin/redis-server --bind 127.0.0.1 --port 6379 --protected-mode yes --requirepass "$REDIS_PASSWORD" --dir "$OPIK_DATA_ROOT/redis" --appendonly yes --appenddirname appendonlydir --save 900 1 --save 300 10 --save 60 10000 --logfile ""'
user=redis
autostart=false
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:zookeeper]
command=/bin/bash -lc 'exec /opt/zookeeper/bin/zkServer.sh start-foreground /etc/opik/zoo.cfg'
user=zookeeper
environment=JMXDISABLE="true",JVMFLAGS="-Xms256m -Xmx512m"
autostart=false
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:minio]
command=/bin/bash -lc 'exec /usr/local/bin/minio server --address 127.0.0.1:9002 --console-address 127.0.0.1:9090 "$OPIK_DATA_ROOT/minio"'
user=minio
autostart=false
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:clickhouse]
command=/bin/bash -lc 'exec /usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml'
user=clickhouse
autostart=false
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=180
stopasgroup=true
killasgroup=true
priority=200
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:opik-backend]
command=/bin/bash -lc 'cd /opt/opik && exec ./entrypoint.sh'
user=opik
autostart=false
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
priority=400
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=false
autorestart=true
startsecs=2
startretries=5
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=500
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:watchdog]
command=/usr/local/bin/opik-watchdog
autostart=true
autorestart=true
startsecs=1
priority=1000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
